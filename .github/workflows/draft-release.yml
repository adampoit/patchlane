name: Draft GitHub Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: draft-release-${{ github.ref }}

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run release eval gate
        id: evals
        env:
          PATCHLANE_EVAL_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          npm run evals -- \
            --scenario all \
            --fail-fast \
            2>&1 | tee "${RUNNER_TEMP}/patchlane-evals.log"

      - name: Upload failed eval artifacts
        if: ${{ failure() && steps.evals.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: failed-release-evals
          path: |
            ${{ runner.temp }}/patchlane-evals.log
            ${{ runner.temp }}/patchlane-*/pi-output.jsonl
            ${{ runner.temp }}/patchlane-*/user-driver-transcript.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Install OpenCode
        run: npm install -g opencode-ai

      - name: Resolve release
        id: release
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          target="$(git rev-parse HEAD)"

          {
            printf 'version=%s\n' "$version"
            printf 'tag=%s\n' "$tag"
            printf 'target=%s\n' "$target"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          TARGET_REF: ${{ steps.release.outputs.target }}
        run: npm run changelog -- --to "$TARGET_REF"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          TARGET_REF: ${{ steps.release.outputs.target }}
        run: |
          gh release create "$RELEASE_TAG" \
            --draft \
            --target "$TARGET_REF" \
            --title "v$RELEASE_VERSION" \
            --notes-file UPCOMING_CHANGELOG.md

      - name: Upload generated notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: UPCOMING_CHANGELOG.md
