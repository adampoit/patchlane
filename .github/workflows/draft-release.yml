name: Draft GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, without a leading v. Defaults to package.json version.'
        required: false
        type: string
      tag:
        description: 'Release tag. Defaults to v<version>.'
        required: false
        type: string
      from:
        description: 'Starting ref for release notes. Defaults to latest tag.'
        required: false
        type: string
      target:
        description: 'Target ref for the release tag.'
        required: false
        default: main
        type: string
      model:
        description: 'OpenCode model for summarization.'
        required: false
        default: opencode/deepseek-v4-flash
        type: string

permissions:
  contents: write

concurrency: draft-release-${{ inputs.tag || inputs.version || github.run_id }}

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install OpenCode
        run: npm install -g opencode-ai

      - name: Resolve release inputs
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_FROM: ${{ inputs.from }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version="$(node -p "require('./package.json').version")"
          fi

          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag="v$version"
          fi

          target="$INPUT_TARGET"
          if [ -z "$target" ]; then
            target="main"
          fi

          {
            printf 'version=%s\n' "$version"
            printf 'tag=%s\n' "$tag"
            printf 'target=%s\n' "$target"
            printf 'from=%s\n' "$INPUT_FROM"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_RELEASE_NOTES_MODEL: ${{ inputs.model }}
          FROM_REF: ${{ steps.release.outputs.from }}
          TARGET_REF: ${{ steps.release.outputs.target }}
        run: |
          args=(--to "$TARGET_REF")
          if [ -n "$FROM_REF" ]; then
            args+=(--from "$FROM_REF")
          fi
          npm run changelog -- "${args[@]}"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          TARGET_REF: ${{ steps.release.outputs.target }}
        run: |
          gh release create "$RELEASE_TAG" \
            --draft \
            --target "$TARGET_REF" \
            --title "v$RELEASE_VERSION" \
            --notes-file UPCOMING_CHANGELOG.md

      - name: Upload generated notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: UPCOMING_CHANGELOG.md
