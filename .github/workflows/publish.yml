name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Check generated artifacts
        run: npm run artifacts:check

      - name: Check eval contracts
        run: npm run evals:contracts

      - name: Run tests
        run: npm test

      - name: Run publication eval gate
        id: evals
        env:
          PATCHLANE_EVAL_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          npm run evals -- \
            --scenario all \
            --fail-fast \
            2>&1 | tee "${RUNNER_TEMP}/patchlane-evals.log"

      - name: Upload failed eval artifacts
        if: ${{ failure() && steps.evals.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: failed-publication-evals
          path: |
            ${{ runner.temp }}/patchlane-evals.log
            ${{ runner.temp }}/patchlane-*/pi-output.jsonl
            ${{ runner.temp }}/patchlane-*/user-driver-transcript.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish to npm
        run: npm publish
