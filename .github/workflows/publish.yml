name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup npm publishing
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Install dependencies
        run: nix develop --command npm ci

      - name: Check generated artifacts
        run: nix develop --command npm run artifacts:check

      - name: Check eval contracts
        run: nix develop --command npm run evals:contracts

      - name: Run tests
        run: nix develop --command npm test

      - name: Publish to npm
        run: nix develop --command npm publish
