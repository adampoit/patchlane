name: Validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Install dependencies
        run: nix develop --command npm ci

      - name: Check generated artifacts
        run: nix develop --command npm run artifacts:check

      - name: Check eval contracts
        run: nix develop --command npm run evals:contracts

      - name: Run tests
        run: nix develop --command npm test
